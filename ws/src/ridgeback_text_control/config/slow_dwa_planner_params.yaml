DWAPlannerROS:
  acc_lim_x: 0.35
  acc_lim_y: 0.35
  acc_lim_theta: 0.65

  max_vel_x: 0.18
  min_vel_x: -0.08
  max_vel_y: 0.12
  min_vel_y: -0.12

  max_vel_trans: 0.20
  min_vel_trans: 0.02
  trans_stopped_vel: 0.02

  max_vel_theta: 0.45
  min_vel_theta: 0.10
  theta_stopped_vel: 0.05

  yaw_goal_tolerance: 0.22
  xy_goal_tolerance: 0.30
  latch_xy_goal_tolerance: false

  sim_time: 2.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 8
  vy_samples: 8
  vth_samples: 20

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.3
  scaling_speed: 0.15
  max_scaling_factor: 0.2

  penalize_negative_x: false
  publish_traj_pc: true
  publish_cost_grid: true
  prune_plan: true
